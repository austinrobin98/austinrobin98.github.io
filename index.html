<!DOCTYPE html>
<!-- Corrected initial HTML structure errors identified during W3C validation  -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legendary Pokémon Showcase</title>
</head>

<body style="background-color: #eaf2fa; font-family: Arial, sans-serif; color: #243447; margin: 0; padding: 25px;">

    <header style="text-align: center; margin-bottom: 30px;">
        <h1>Legendary Pokémon Showcase</h1>
        <p>Discover the legendary birds of the Pokémon world!</p>
    </header>
    <!-- Increased the main container width from 1000px to 1100px for more layout space. Kept Moltres below Articuno and Zapdos -->
    <main style="max-width: 1100px; margin: 0 auto; text-align: center;">
    <!-- Pokemon Card Section: Displays the three legendary birds with their images, descriptions, and individual card styling. -->
    <!-- Changed Articuno's colors to match its Ice type, increased padding for inner spacing, and margin to reduce crowding. -->
        <div style="display: inline-block; width: 260px; padding: 25px; margin: 20px; border: 2px solid #75b9e7; border-radius: 12px; background-color: #d9f2ff; vertical-align: top;">
            <h2>Articuno</h2>
            <!--Corrected the AI-generated image file paths by replacing spaces with %20 to fix HTML validation errors.-->
            <img src="Image%201%20-%20Articuno.jpg" alt="Articuno flying beneath the northern lights" style="width: 100%; border-radius: 8px;">
            <p>Articuno is a legendary Ice and Flying-type Pokémon.</p>
        </div>
        <!-- Changed Zapdos's colors to match its Electric type, increased padding for inner spacing, and margin to reduce crowding. -->
        <div style="display: inline-block; width: 260px; padding: 25px; margin: 20px; border: 2px solid #f0bd48; border-radius: 12px; background-color: #fff2bf; vertical-align: top;">
            <h2>Zapdos</h2>
            <!--Corrected the AI-generated image file paths by replacing spaces with %20 to fix HTML validation errors.-->
            <img src="Image%203%20-%20Zapdos.jpg" alt="Zapdos flying through a thunderstorm" style="width: 100%; border-radius: 8px;">
            <p>Zapdos is a legendary Electric and Flying-type Pokémon.</p>
        </div>
        <!-- Changed Moltres's colors to match its Fire type, increased padding for inner spacing, and margin to reduce crowding. -->
        <div style="display: inline-block; width: 260px; padding: 25px; margin: 20px; border: 2px solid #ed8160; border-radius: 12px; background-color: #ffe0d0; vertical-align: top;">
            <h2>Moltres</h2>
            <!--Corrected the AI-generated image file paths by replacing spaces with %20 to fix HTML validation errors.-->
            <img src="Image%202%20-%20Moltres.jpg" alt="Moltres soaring above an erupting volcano" style="width: 100%; border-radius: 8px;">
            <p>Moltres is a legendary Fire and Flying-type Pokémon.</p>
        </div>

    </main>

</body>
</html>
